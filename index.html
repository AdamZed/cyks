<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Can you keep score?</title>

    <meta
      name="description"
      content="A simple team vs team scoreboard webapp."
    />
    <meta
      name="keywords"
      content="scoreboard, scoreboard app, volleyball, soccer, whistle, music, score"
    />
    <meta name="author" content="Adam Zanon" />
    <meta name="theme-color" content="#202937" />

    <meta property="og:title" content="Can you keep score?" />
    <meta
      property="og:description"
      content="A simple team vs team scoreboard webapp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./imgs/preview.png" />
    <meta property="og:url" content="https://vault.adamzanon.com/cyks" />

    <link rel="icon" href="./imgs/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="manifest" href="./manifest.json" />

    <script defer src="./src/index.js"></script>
    <script defer>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
      }
    </script>

    <link
      rel="preload"
      href="./fonts/OverpassMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="./imgs/reset.svg" as="image" />
    <link rel="preload" href="./imgs/settings.svg" as="image" />
    <link rel="preload" href="./imgs/whistle.svg" as="image" />
    <link rel="preload" href="./imgs/github.svg" as="image" />
    <link rel="preload" href="./imgs/switch.svg" as="image" />

    <noscript>
      <link rel="stylesheet" href="./css/index.css" />
    </noscript>
  </head>

  <body class="touch-manipulation bg-gray-800 select-none">
    <div
      class="portrait:hiddden grid h-screen w-screen text-center portrait:grid-flow-col portrait:grid-cols-[85%_15%] portrait:grid-rows-7 landscape:grid-cols-7 landscape:grid-rows-[85%_15%]"
    >
      <div
        col-idx="1:1a"
        onclick="incScore(1)"
        class="flex items-center justify-center border-black portrait:row-span-3 portrait:border-b-4 landscape:col-span-3 landscape:border-r-4"
      >
        <div
          class="font-family-overpass-mono overflow-hidden text-center portrait:text-[34vh] landscape:text-[32vw]"
          id="score-t1"
        >
          0
        </div>
      </div>
      <div
        class="grid portrait:grid-cols-5 portrait:grid-rows-1 landscape:grid-cols-1 landscape:grid-rows-6"
      >
        <div class="flex justify-center">
          <div
            onclick="openSettings()"
            class="flex min-w-full items-center justify-center bg-slate-300 inset-ring-2 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
          >
            <img
              class="max-h-[98%] max-w-[80%] p-2"
              src="./imgs/settings.svg"
            />
          </div>
        </div>
        <div
          onclick="openTeams()"
          class="flex items-center justify-center bg-gray-400 text-[3vw] font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
        >
          <div>TEAMS</div>
        </div>

        <div
          onclick="playWhistle()"
          class="flex items-center justify-center bg-slate-600 inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:col-span-1 landscape:row-span-2"
        >
          <img class="max-h-[98%] max-w-[80%] p-2" src="./imgs/whistle.svg" />
        </div>
        <div
          onclick="openGames()"
          class="flex items-center justify-center bg-gray-400 text-[3vw] font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
        >
          <div>GAMES</div>
        </div>
        <div class="flex justify-center">
          <div
            onclick="swapTeams()"
            class="flex min-w-full items-center justify-center bg-slate-300 inset-ring-2 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
          >
            <img
              class="max-h-[70%] max-w-[80%] p-2 portrait:rotate-90"
              src="./imgs/switch.svg"
            />
          </div>
        </div>
      </div>

      <div
        col-idx="2:1a"
        onclick="incScore(2)"
        class="flex items-center justify-center overflow-hidden border-black portrait:row-span-3 portrait:border-t-4 landscape:col-span-3 landscape:border-l-4"
      >
        <div
          class="font-family-overpass-mono text-center portrait:text-[34vh] landscape:text-[32vw]"
          id="score-t2"
        >
          0
        </div>
      </div>
      <div
        onclick="decScore(1)"
        col-idx="1:1b"
        class="flex items-center justify-center font-bold inset-ring-2 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:text-[6vw] landscape:text-[3vw]"
      >
        <div id="score-t1-m">-</div>
      </div>
      <div
        onclick="openScoreSet(1)"
        col-idx="1:1b"
        class="flex items-center justify-center font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:text-[6vw] landscape:text-[3vw]"
      >
        <div id="score-t1-s">⊙</div>
      </div>
      <div
        onclick="incScore(1)"
        col-idx="1:1b"
        class="flex items-center justify-center border-black font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:border-b-4 portrait:text-[6vw] landscape:border-r-4 landscape:text-[3vw]"
      >
        <div id="score-t1-p">+</div>
      </div>
      <div class="flex justify-center">
        <div
          onclick="reset()"
          class="flex min-w-full items-center justify-center bg-red-700 inset-ring-5 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
        >
          <img class="h-[80%] p-2" src="./imgs/reset.svg" />
        </div>
      </div>
      <div
        onclick="decScore(2)"
        col-idx="2:1b"
        class="flex items-center justify-center border-black font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:border-t-4 portrait:text-[6vw] landscape:border-l-4 landscape:text-[3vw]"
      >
        <div id="score-t2-m">-</div>
      </div>
      <div
        onclick="openScoreSet(2)"
        col-idx="2:1b"
        class="flex items-center justify-center font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:text-[6vw] landscape:text-[3vw]"
      >
        <div id="score-t2-s">⊙</div>
      </div>
      <div
        onclick="incScore(2)"
        col-idx="2:1b"
        class="flex items-center justify-center font-bold inset-ring-3 inset-ring-black/25 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70 portrait:text-[6vw] landscape:text-[3vw]"
      >
        <div id="score-t2-p">+</div>
      </div>
    </div>

    <div
      id="score-set"
      class="absolute top-0 left-0 hidden h-full w-full items-center justify-center bg-black/80"
    >
      <div
        class="flex h-64 w-md flex-col items-center justify-center gap-8 rounded-4xl bg-gray-900 p-10 shadow-2xl shadow-black"
      >
        <div
          class="fixed top-5 left-5 rounded-md bg-gray-700 px-5 text-7xl text-white hover:cursor-pointer"
          onclick="closeScoreSet()"
        >
          X
        </div>
        <h2 id="enter-score-text" class="block text-3xl text-white">
          Enter Score
        </h2>
        <input
          id="score-set-in"
          class="w-32 bg-white text-center text-3xl"
          type="number"
          min="0"
          max="99"
          inputmode="numeric"
          pattern="[0-9]*"
        />
        <div class="flex gap-2">
          <button
            class="button w-24 rounded bg-gray-600 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="closeScoreSet()"
          >
            Close
          </button>
          <button
            class="button w-24 rounded bg-gray-400 px-5 text-2xl transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="confirmScoreSet()"
          >
            Set
          </button>
        </div>
      </div>
    </div>
    <div
      id="settings"
      class="absolute top-0 left-0 hidden h-full w-full items-center justify-center bg-black/80"
    >
      <div
        class="flex h-72 w-md flex-col items-center justify-center gap-4 overflow-scroll rounded-2xl bg-gray-900 text-white shadow-2xl shadow-black"
      >
        <div
          class="fixed top-5 left-5 rounded-md bg-gray-700 px-5 text-7xl hover:cursor-pointer"
          onclick="closeSettings()"
        >
          X
        </div>

        <h2 class="text-3xl text-white">Settings</h2>

        <div class="flex flex-col gap-2">
          <h3 class="block text-lg text-white">Whistle</h3>
          <div class="flex w-56 justify-baseline gap-5">
            <input
              type="checkbox"
              id="whistle-onoff"
              name="whistle-onoff"
              onchange="setWhistleState(this)"
            />
            <label for="whistle-onof">Enabled</label>
          </div>
        </div>

        <div class="flex gap-2">
          <button
            class="button w-24 rounded bg-gray-600 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="resetConfig()"
          >
            Reset
          </button>
          <button
            class="button w-24 rounded bg-gray-400 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="closeSettings()"
          >
            Done
          </button>
        </div>
        <div class="text-sm">More settings coming soon</div>
        <div>
          <a
            href="https://github.com/AdamZed/cyks"
            target="_blank"
            onclick="showSettings()"
            class="flex h-10 w-16 items-center justify-center rounded-xl bg-purple-400 transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
          >
            <img class="h-[90%]" src="./imgs/github.svg" />
          </a>
        </div>
      </div>
    </div>
    <div
      id="teams"
      class="absolute top-0 left-0 hidden h-full w-full items-center justify-center bg-black/80"
    >
      <div
        class="flex h-72 w-md flex-col items-center justify-center gap-4 overflow-scroll rounded-2xl bg-gray-900 text-white shadow-2xl shadow-black"
      >
        <div
          class="fixed top-5 left-5 rounded-md bg-gray-700 px-5 text-7xl hover:cursor-pointer"
          onclick="closeTeams()"
        >
          X
        </div>

        <h2 class="text-3xl text-white">Teams</h2>
        <div id="team-list" class="flex flex-col gap-5">
          <div class="flex items-center justify-baseline gap-5">
            <div class="flex gap-2">
              <div
                onclick="playTeam(0, 0)"
                class="rounded bg-gray-300 px-2 py-0.5 text-black hover:cursor-pointer"
              >
                <
              </div>
              <div
                onclick="playTeam(0, 1)"
                class="rounded bg-gray-300 px-2 py-0.5 text-black hover:cursor-pointer"
              >
                >
              </div>
            </div>
            <label
              id="name-t0"
              col-idx="t0"
              class="rounded p-1"
              onblur="updateName(0)"
              contenteditable="true"
              >Team 1</label
            >
            <input
              id="col-t0-bg"
              name="col-t0-bg"
              type="color"
              onchange="setTeamCol(0, this, 1)"
            />
            <input
              id="col-t0-fg"
              name="col-t0-fg"
              type="color"
              onchange="setTeamCol(0, this, 0)"
            />
          </div>
          <div class="flex items-center justify-baseline gap-5">
            <div class="flex gap-2">
              <div
                onclick="playTeam(0, 0)"
                class="rounded bg-gray-300 px-2 py-0.5 text-black hover:cursor-pointer"
              >
                <
              </div>
              <div
                onclick="playTeam(0, 1)"
                class="rounded bg-gray-300 px-2 py-0.5 text-black hover:cursor-pointer"
              >
                >
              </div>
            </div>
            <label
              id="name-t1"
              col-idx="t1"
              class="rounded p-1"
              onblur="updateName(1)"
              contenteditable="true"
              >Team 2</label
            >
            <input
              id="col-t1-bg"
              name="col-t1-bg"
              type="color"
              onchange="setTeamCol(1, this, 1)"
            />
            <input
              id="col-t1-fg"
              name="col-t1-fg"
              type="color"
              onchange="setTeamCol(1, this, 0)"
            />
          </div>
        </div>

        <div class="flex gap-2">
          <button
            class="button w-24 rounded bg-gray-600 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="resetTeams()"
          >
            Reset
          </button>
          <button
            class="button w-24 rounded bg-gray-400 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="addTeam()"
          >
            Add
          </button>
        </div>
      </div>
    </div>
    <div
      id="games"
      class="absolute top-0 left-0 hidden h-full w-full items-center justify-center bg-black/80"
    >
      <div
        class="flex h-72 w-md flex-col items-center justify-center gap-4 overflow-scroll rounded-2xl bg-gray-900 text-white shadow-2xl shadow-black"
      >
        <div
          class="fixed top-5 left-5 rounded-md bg-gray-700 px-5 text-7xl hover:cursor-pointer"
          onclick="closeGames()"
        >
          X
        </div>

        <h2 class="text-3xl text-white">Games</h2>
        <div class="flex justify-center">
          <button
            class="button rounded bg-gray-400 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
            onclick="saveCurrentGame()"
          >
            Log Current Game
          </button>
        </div>
        <div class="flex flex-col gap-2">
          <div
            id="game-list"
            class="flex flex-col items-center justify-baseline gap-5"
          >
            <div class="flex gap-2">
              <div
                onclick="removeGame(0)"
                class="rounded bg-gray-300 px-2 py-0.5 text-black hover:cursor-pointer"
              >
                X
              </div>
              <p>
                <span col-idx="t0" class="rounded px-2 py-1">Team 1</span>
                <span class="p-1 font-bold text-green-400">0</span> -
                <span class="p-1">0</span>
                <span col-idx="t1" class="rounded px-2 py-1">Team 2</span>
              </p>
            </div>
          </div>

          <div class="flex justify-center">
            <button
              class="button w-24 rounded bg-gray-600 px-5 text-2xl text-white transition-all hover:cursor-pointer hover:brightness-70 active:brightness-70"
              onclick="resetGames()"
            >
              Clear
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
